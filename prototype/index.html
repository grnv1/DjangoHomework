<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - CMS 内容管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <span class="site-name">CMS 内容管理系统</span>
            <nav class="nav">
                <a href="index.html">首页</a>
                <a href="category.html">栏目</a>
                <a href="favorites.html">我的收藏</a>
                <a href="login.html" class="btn btn-primary">登录</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- 查询区：四个独立查询项 -->
            <section class="card search-card">
                <h2>文章查询</h2>
                <form class="search-form" method="get" action="index.html">
                    <div class="field">
                        <label for="title">按标题</label>
                        <input type="text" id="title" name="title" placeholder="输入文章标题关键词" value="交通">
                    </div>
                    <div class="field">
                        <label for="date_from">按发表时间</label>
                        <div style="display:flex; gap:6px;">
                            <input type="date" id="date_from" name="date_from" value="2026-07-01">
                            <span style="line-height:36px;color:var(--text-light);">至</span>
                            <input type="date" id="date_to" name="date_to" value="2026-08-08">
                        </div>
                    </div>
                    <div class="field">
                        <label for="category">按栏目</label>
                        <select id="category" name="category">
                            <option value="">全部栏目</option>
                            <option value="1">教学动态</option>
                            <option value="2" selected>科研成果</option>
                            <option value="3">校园通知</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="tag">按标签</label>
                        <select id="tag" name="tag">
                            <option value="">全部标签</option>
                            <option value="1">科研</option>
                            <option value="2">就业</option>
                            <option value="3">招生</option>
                        </select>
                    </div>
                    <div class="search-actions">
                        <button type="submit" class="btn btn-primary">查询</button>
                        <a href="index.html" class="btn btn-outline">重置</a>
                    </div>
                </form>
            </section>

            <!-- 查询提示 -->
            <div class="alert">共找到 3 条结果（条件可单独或组合使用）。</div>

            <!-- 文章列表 -->
            <article class="item-card">
                <h3><a href="item_detail.html">交大轨道交通新型轴承技术取得阶段性突破</a></h3>
                <div class="item-meta">
                    <span class="badge">科研成果</span>
                    <span>作者：王老师</span>
                    <span>发表时间：2026-08-05 10:30</span>
                    <span>浏览 128 次</span>
                </div>
            </article>

            <article class="item-card">
                <h3><a href="item_detail.html">智能交通系统在城市道路中的应用研究</a></h3>
                <div class="item-meta">
                    <span class="badge">科研成果</span>
                    <span class="badge badge-tag">科研</span>
                    <span>作者：李老师</span>
                    <span>发表时间：2026-07-28 15:00</span>
                    <span>浏览 86 次</span>
                </div>
            </article>

            <article class="item-card">
                <h3><a href="item_detail.html">高速铁路枢纽站客流组织优化研究</a></h3>
                <div class="item-meta">
                    <span class="badge">科研成果</span>
                    <span class="badge badge-tag">科研</span>
                    <span>作者：张老师</span>
                    <span>发表时间：2026-07-15 09:20</span>
                    <span>浏览 210 次</span>
                </div>
            </article>

            <!-- 分页 -->
            <nav class="pagination">
                <span class="current">1</span>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">下一页 »</a>
            </nav>
        </div>
    </main>

    <footer class="footer">
        <div class="container">CMS 内容管理系统 · 课程作业原型</div>
    </footer>
</body>
</html>
