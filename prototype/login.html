<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - CMS 内容管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <span class="site-name">CMS 内容管理系统</span>
            <nav class="nav">
                <a href="index.html">首页</a>
                <a href="register.html">注册</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="auth-wrap">
            <div class="card">
                <h1>用户登录</h1>

                <!-- 登录失败提示 -->
                <div class="form-error" style="margin-bottom:10px;">用户名或密码错误。</div>

                <form method="post" action="/login/">
                    <!-- 登录成功后的回跳地址（未登录访问收藏等页面时自动携带） -->
                    <input type="hidden" name="next" value="/item/1/">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                </form>

                <p class="auth-footer">还没有账号？<a href="register.html">立即注册</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">CMS 内容管理系统 · 课程作业原型</div>
    </footer>
</body>
</html>
