<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - CMS 内容管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <span class="site-name">CMS 内容管理系统</span>
            <nav class="nav">
                <a href="index.html">首页</a>
                <a href="login.html">登录</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="auth-wrap">
            <div class="card">
                <h1>用户注册</h1>

                <!-- 表单校验失败时回显的错误 -->
                <div class="form-error" style="margin-bottom:10px;">用户名已存在，请更换。</div>

                <form method="post" action="/register/">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入用户名" value="zhangsan">
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱（选填）</label>
                        <input type="email" id="email" name="email" placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label for="password1">密码</label>
                        <input type="password" id="password1" name="password1" placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label for="password2">确认密码</label>
                        <input type="password" id="password2" name="password2" placeholder="请再次输入密码">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">注册</button>
                </form>

                <p class="auth-footer">已有账号？<a href="login.html">直接登录</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">CMS 内容管理系统 · 课程作业原型</div>
    </footer>
</body>
</html>
