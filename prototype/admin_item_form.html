<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建文章 - CMS 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <span class="admin-site-name">CMS 管理后台</span>
            <nav class="nav">
                <span style="font-size:13px;color:#90a4ae;">当前用户：wang（内容编辑）</span>
                <a href="index.html">返回前台</a>
                <a href="login.html">退出登录</a>
            </nav>
        </div>
    </header>
    <nav class="admin-nav">
        <div class="container">
            <a href="admin_dashboard.html">后台首页</a>
            <a href="admin_item_list.html" class="active">文章管理</a>
            <a href="admin_category_list.html">栏目管理</a>
        </div>
    </nav>

    <main class="admin-main">
        <div class="container">
            <div class="admin-toolbar">
                <h1>新建文章</h1>
                <a href="admin_item_list.html" class="btn btn-outline">返回列表</a>
            </div>

            <div class="card admin-form">
                <form method="post" action="admin_item_list.html">
                    <div class="form-group">
                        <label for="title">文章标题</label>
                        <input type="text" id="title" name="title" placeholder="请输入文章标题" value="高速铁路枢纽站客流组织优化研究">
                    </div>

                    <div class="form-group">
                        <label for="category">所属栏目</label>
                        <select id="category" name="category">
                            <option value="1">教学动态</option>
                            <option value="2" selected>科研成果</option>
                            <option value="3">校园通知</option>
                            <option value="4">招生就业</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tags">标签（可多选）</label>
                        <select id="tags" name="tags" multiple style="min-height:90px;">
                            <option value="1" selected>科研</option>
                            <option value="2">就业</option>
                            <option value="3">招生</option>
                            <option value="4">轴承</option>
                        </select>
                        <p class="form-help">按住 Ctrl 可多选。</p>
                    </div>

                    <div class="form-group">
                        <label for="publish_time">发表时间</label>
                        <input type="datetime-local" id="publish_time" name="publish_time" value="2026-08-08T09:00">
                        <p class="form-help">可手动设置（支持定时发布）；留空并点击"发布"时自动取当前时间。</p>
                    </div>

                    <div class="form-group">
                        <label for="status">状态</label>
                        <select id="status" name="status">
                            <option value="0">草稿（保存后前台不可见）</option>
                            <option value="1" selected>已发布（保存后前台可见）</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="content">正文内容</label>
                        <textarea id="content" name="content" placeholder="请输入文章正文">高速铁路枢纽站客流组织优化研究

本文针对高速铁路枢纽站在节假日大客流下的组织难题，提出基于客流预测的优化调度方案，为运营管理提供参考。
                        </textarea>
                    </div>

                    <!-- 作者：内容编辑只读锁定，超管可改 -->
                    <div class="form-group">
                        <label for="author">作者</label>
                        <input type="text" id="author" name="author" value="wang（当前登录用户）" readonly>
                        <p class="form-help">内容编辑的作者固定为当前登录人，不可修改；超级管理员可指定。</p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="admin_item_list.html" class="btn btn-outline">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
